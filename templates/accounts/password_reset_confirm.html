{% extends "base.html" %}
{% block title %}Reset Password | PushpaRecycle{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-panel">
    <p class="eyebrow dark">Secure reset</p>
    <h1>Reset Password</h1>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label>New Password{{ form.new_password1 }}</label>
      <label>Confirm Password{{ form.new_password2 }}</label>
      <button class="btn btn-success w-100" type="submit">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}
